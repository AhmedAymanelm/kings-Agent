<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>لوحة الوكيل الذكي</title>
  <meta name="description" content="لوحة تحكم وكيل واتساب الذكي لإدارة العملاء والمحادثات والحملات التسويقية" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets — order matters -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/views.css" />

  <!-- Minimal body reset before CSS loads -->
  <style>
    body { margin: 0; background: #f2f5f3; }
    @media (prefers-color-scheme: dark) { body { background: #0d1512; } }
  </style>
</head>
<body>

  <!-- ===== Login screen ===== -->
  <div class="login" id="login" role="main" aria-label="صفحة تسجيل الدخول"></div>

  <!-- ===== App shell (hidden until logged in) ===== -->
  <div class="app" id="shell" hidden>

    <!-- Sidebar -->
    <aside class="side" aria-label="الشريط الجانبي">
      <div class="brand">
        <div class="logo" aria-hidden="true">د</div>
        <div>
          <b>ديمو</b>
          <span>وكيل واتساب الذكي</span>
        </div>
      </div>

      <!-- Current user -->
      <div class="me">
        <span class="avatar" id="meAv" aria-hidden="true"></span>
        <div class="grow">
          <b id="meName"></b>
          <span class="pill" id="meRole"></span>
        </div>
        <button class="link" id="logout" aria-label="تسجيل الخروج">خروج</button>
      </div>

      <!-- Navigation -->
      <nav id="nav" aria-label="أقسام التطبيق"></nav>

      <!-- Agent status widget -->
      <div class="agent" aria-label="حالة الوكيل">
        <div class="row">
          <span>
            <i class="dot" id="agentDot" aria-hidden="true"></i>
            <b id="agentState">الوكيل يعمل</b>
          </span>
          <button
            class="switch"
            id="agentSwitch"
            role="switch"
            aria-checked="true"
            aria-label="تشغيل أو إيقاف الوكيل"
          ></button>
        </div>
        <span class="muted" id="agentNote"></span>
      </div>
    </aside>

    <!-- Main content area -->
    <main id="mainContent" aria-live="polite" aria-atomic="false">
      <div class="top">
        <div>
          <h1 id="pageTitle"></h1>
          <p id="pageSub"></p>
        </div>
        <span class="tag">نسخة تجريبية · بيانات أمثلة</span>
      </div>
      <!-- View content injected here -->
      <div id="view"></div>
    </main>

  </div>

  <!-- Toast notifications -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ===== JavaScript modules — loaded in dependency order ===== -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/chart.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/alerts.js"></script>
  <script src="js/views/chats.js"></script>
  <script src="js/views/customers.js"></script>
  <script src="js/views/facebook.js"></script>
  <script src="js/views/schedule.js"></script>
  <script src="js/views/insights.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
